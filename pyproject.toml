[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-system"
version = "0.1.0"
description = "A-share quantitative research data platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "akshare==1.18.78",
  "duckdb>=1.2,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "xlrd>=2,<3",  # Shenwan classification workbooks (.xls)
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<10",
]
# Mean-variance portfolio construction (portfolio/optimizer.py, imported lazily).
optimizer = [
  "osqp>=1.0,<2",
  "scipy>=1.14,<2",
]
# Stage 4: business database (decisions, accounts, audit) and, later, the API (ADR-010).
app = [
  "alembic>=1.20,<2",
  "sqlalchemy>=2.1,<2.2",
]

[project.scripts]
quant-data = "quant_system.data_platform.cli:main"
quant-backtest = "quant_system.backtest.cli:main"
quant-research = "quant_system.research.cli:main"
quant-decision = "quant_system.decision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant_system.app.db" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs the local market database (skipped when absent)"]

